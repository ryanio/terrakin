version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The server's playwright-core draws scene photos with the Chromium that @playwright/test
      # installs in CI. Bumped apart, the server asks for a browser build CI never downloaded.
      # It sits first because a dependency joins the first group it matches.
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright-core"
      dev-tools:
        dependency-type: development
      # Sentry packages share types across @sentry/core. Bumped apart, two copies of
      # @sentry/core land in the tree and the server's typecheck fails on the mismatch.
      sentry:
        patterns:
          - "@sentry/*"
    open-pull-requests-limit: 5
    ignore:
      # Pinned in packages/cards: later versions load HarfBuzz in a way a Worker can't start.
      - dependency-name: satori
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
