version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # Pinned in packages/cards: later versions load HarfBuzz in a way a Worker can't start.
      - dependency-name: satori
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
