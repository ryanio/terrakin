name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm typecheck
      - run: pnpm kb:check
      - run: pnpm gen:check
      - run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  # The unit and integration tests, beside verify's other checks rather than after them: they take
  # longer than all the rest together.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Whether this run needs e2e: not when everything changed since the last green run on main is
  # the sim, scripts, docs, or Markdown (scripts/e2e-needed.ts, decision 0200). It reads the run
  # list, so it needs `actions: read`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: decide
        run: node scripts/e2e-needed.ts >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  # e2e runs in four jobs at once: the 2D specs in three shards balanced by time (e2e/suite.ts),
  # and the 3D smoke alone with one worker, since software WebGL takes a runner's whole CPU
  # (e2e/AGENTS.md). The rest of the 3D specs run nightly (nightly.yml).
  e2e:
    name: e2e (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: 2D 1 of 3, only: 2d, shard: "1", args: "" }
          - { name: 2D 2 of 3, only: 2d, shard: "2", args: "" }
          - { name: 2D 3 of 3, only: 2d, shard: "3", args: "" }
          - { name: 3D smoke, only: 3d, shard: "", args: --workers=1 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium's headless shell, the only browser the projects use, cached by the exact
      # @playwright/test version, which pins its browser builds. No apt: the runner image has every
      # library the shell links, and `--with-deps` only added fonts for scripts no spec shows,
      # fetched at mirror speed (11 seconds to 4.5 minutes a job). A library a new image lacks is
      # installed then, before the specs would fail to launch.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium
      - name: Install system libraries the browser lacks
        run: |
          if find ~/.cache/ms-playwright/chromium_headless_shell-*/ -type f \
            \( -name headless_shell -o -name '*.so' \) -exec ldd {} + | grep 'not found'; then
            pnpm exec playwright install-deps chromium
          fi
      - run: pnpm e2e ${{ matrix.args }}
        env:
          TERRAKIN_E2E_ONLY: ${{ matrix.only }}
          TERRAKIN_E2E_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy terrakin.org once everything above passed on a push to main (issue #21). The same
  # `pnpm cf:deploy` as from a laptop (it skips if main has moved past this commit), then a check
  # that the live world answers. e2e counts as passed only when it passed, or when `changes` said
  # this run doesn't need it; a skipped job would otherwise skip the deploy with it, and `!cancelled()`
  # keeps a run a newer push cancelled from deploying. Its outputs are for `smoke`: whether this
  # run uploaded (scripts/deploy.ts skips a commit main has moved past), and the built page's script.
  deploy:
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' && needs.verify.result == 'success' &&
      needs.test.result == 'success' && needs.secrets.result == 'success' &&
      (needs.e2e.result == 'success' ||
      (needs.e2e.result == 'skipped' && needs.changes.outputs.e2e == 'false'))
    needs: [changes, verify, test, e2e, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      script: ${{ steps.deploy.outputs.script }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: deploy
        run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live world
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://terrakin.org/v1/health | grep -q '"ok":true'; then exit 0; fi
            sleep 10
          done
          echo "terrakin.org/v1/health didn't answer ok after the deploy" >&2
          exit 1

  # Ask the Worker that was just deployed for what the suite can't see from Node (decision 0250):
  # pictures it has to draw, the world's switches, the start files, and the build's script
  # (scripts/deploy-smoke.ts). Read-only GETs with no secrets. It comes after `deploy` and nothing
  # waits on it, so it never holds this run's deploy back, and nothing is rolled back when it
  # fails. `!cancelled()` is there because a job with no status check is skipped whenever a job
  # anywhere before it was, and `e2e` is skipped on a sim, scripts, or docs push that still deploys.
  smoke:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/deploy-smoke.ts --wait 120 --deployed --script "$SCRIPT"
        env:
          SCRIPT: ${{ needs.deploy.outputs.script }}

  # A red smoke check shows up in the issue list, as a red nightly does (nightly.yml): one open
  # issue labeled `deploy-smoke-red`, opened by the first red check, commented on by each red one
  # after it, and closed by the next green one. A check that didn't run changes nothing, and one
  # that ran out of time counts as red.
  smoke-alert:
    needs: smoke
    if: ${{ !cancelled() && needs.smoke.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, comment on, or close the deploy-smoke-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.smoke.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=deploy-smoke-red
          open=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then gh issue close "$open" --comment "Green again: $RUN_URL"; fi
            exit 0
          fi
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Red again at ${GITHUB_SHA:0:8}: $RUN_URL"
          else
            gh label create "$label" --color B60205 --force \
              --description "The smoke check after a deploy is red (ci.yml)"
            gh issue create --label "$label" --title "The smoke check after a deploy is red" --body \
              "The smoke check of terrakin.org failed after ${GITHUB_SHA:0:8} was deployed: $RUN_URL. That commit is live, and nothing was rolled back. Read it with \`gh run view $GITHUB_RUN_ID --log-failed\`, run it again with \`node scripts/deploy-smoke.ts\`, and see \"The smoke check after a deploy\" in docs/deploy.md for what each check means. The next green check closes this issue, and so does running the failed job again once it passes; each red one until then comments here."
          fi
