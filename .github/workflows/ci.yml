name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm kb:check
      - run: pnpm gen:check
      - run: pnpm build
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  # The unit and integration tests, beside verify's other checks rather than after them: they take
  # longer than all the rest together.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # e2e runs in five jobs at once: the 2D specs in three shards, and each 3D spec alone with one
  # worker, since software WebGL takes a runner's whole CPU (e2e/AGENTS.md). `--no-deps` lets
  # world-3d run without three-d before it, which only keeps the two apart on one machine.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: 2D 1 of 3, only: 2d, args: --shard=1/3 }
          - { name: 2D 2 of 3, only: 2d, args: --shard=2/3 }
          - { name: 2D 3 of 3, only: 2d, args: --shard=3/3 }
          - { name: 3D plot, only: 3d, args: --project=three-d --workers=1 }
          - { name: 3D world, only: 3d, args: --project=world-3d --no-deps --workers=1 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm e2e ${{ matrix.args }}
        env:
          TERRAKIN_E2E_ONLY: ${{ matrix.only }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy terrakin.org once everything above passed on a push to main (issue #21). The same
  # `pnpm cf:deploy` as from a laptop (it skips if main has moved past this commit), then a check
  # that the live world answers.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, test, e2e, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live world
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://terrakin.org/v1/health | grep -q '"ok":true'; then exit 0; fi
            sleep 10
          done
          echo "terrakin.org/v1/health didn't answer ok after the deploy" >&2
          exit 1
