<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@terrakin/figure demo</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="./demo.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div class="stage" id="stage"></div>
    <main class="panel">
      <h1>A body, loaded</h1>
      <p class="hint">Drop a <code>.glb</code> on the page, or pick one. Nothing leaves this tab.</p>
      <p class="row">
        <button type="button" id="plush">Plain plush</button>
        <label class="file">Pick a file <input type="file" id="file" accept=".glb,model/gltf-binary" /></label>
      </p>
      <p class="status" id="status" role="status">Loading the plain plush…</p>
      <ul class="report" id="report"></ul>

      <h2>Clips</h2>
      <p class="row" id="clips"></p>

      <h2>Feelings</h2>
      <p class="row" id="feelings"></p>

      <h2>Moving</h2>
      <label class="slider">Speed <input type="range" id="speed" min="0" max="3" step="0.05" value="0" /> <output id="speed-out">standing</output></label>
      <p class="row">
        <label><input type="checkbox" id="air" /> In the air</label>
        <label><input type="checkbox" id="look" checked /> Look at the pointer</label>
        <label><input type="checkbox" id="still" /> Held still</label>
      </p>
    </main>
  </body>
</html>
