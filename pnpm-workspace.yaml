packages:
  - packages/*

# Security floors for transitive dependencies, until the packages that pull them in catch up.
# sharp <0.35.5 (GHSA-wq5f-xc86-pv6w) and undici <7.30.1 (GHSA-xjj6-f33q-929c) come in through wrangler's miniflare.
overrides:
  sharp@<0.35.5: 0.35.5
  undici@>=7.18.0 <7.30.1: 7.30.1
